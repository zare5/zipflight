<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Zipflight — check a ZIP before you ship it</title>
  <desc id="desc">A dark navy banner with a mint ZIP icon and an illustrative filename collision: Readme.md and README.md.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1c2b"/>
      <stop offset="1" stop-color="#152c3b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9eb7c2" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <path d="M56 93V57h36l17 17v61H56Z" fill="none" stroke="#82e4c4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M92 57v18h17" fill="none" stroke="#82e4c4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 69h8m-4 9h8m-12 9h8m-4 9h8" stroke="#82e4c4" stroke-width="3"/>
  <rect x="78" y="105" width="12" height="17" rx="3" fill="none" stroke="#82e4c4" stroke-width="3"/>
  <text x="132" y="115" fill="#f3f8f8" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Zipflight</text>
  <text x="56" y="191" fill="#f3f8f8" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="600" letter-spacing="-.7">Check a ZIP before you ship it.</text>
  <text x="56" y="235" fill="#b2c4cf" font-family="Segoe UI,Arial,sans-serif" font-size="21">Catch filename problems before extraction.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="56" y="292" width="100" height="33" rx="16.5" fill="#82e4c4" fill-opacity=".11"/>
    <text x="106" y="314" text-anchor="middle" fill="#82e4c4">OFFLINE</text>
    <rect x="168" y="292" width="124" height="33" rx="16.5" fill="#82e4c4" fill-opacity=".11"/>
    <text x="230" y="314" text-anchor="middle" fill="#82e4c4">READ ONLY</text>
    <rect x="304" y="292" width="154" height="33" rx="16.5" fill="#82e4c4" fill-opacity=".11"/>
    <text x="381" y="314" text-anchor="middle" fill="#82e4c4">CI FRIENDLY</text>
  </g>
  <rect x="760" y="61" width="384" height="278" rx="14" fill="#0b1723" stroke="#324958"/>
  <circle cx="784" cy="85" r="4" fill="#617988"/>
  <circle cx="800" cy="85" r="4" fill="#617988"/>
  <circle cx="816" cy="85" r="4" fill="#617988"/>
  <text x="1120" y="90" text-anchor="end" fill="#8da6b5" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1">EXAMPLE ARCHIVE</text>
  <path d="M760 105h384" stroke="#324958"/>
  <g font-family="Consolas,Menlo,monospace" font-size="20">
    <text x="786" y="147" fill="#82e4c4">release.zip</text>
    <path d="M797 165v57m0-40h18m-18 36h18" fill="none" stroke="#526b7b" stroke-width="2"/>
    <text x="827" y="189" fill="#e7eef2">Readme.md</text>
    <text x="827" y="225" fill="#e7eef2">README.md</text>
  </g>
  <rect x="784" y="254" width="336" height="60" rx="8" fill="#f4c483" fill-opacity=".09"/>
  <path d="m803 273 10 18h-20Z" fill="none" stroke="#f4c483" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M803 279v5m0 3v1" stroke="#f4c483" stroke-width="1.6"/>
  <text x="825" y="280" fill="#f4c483" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Two names. One destination?</text>
  <text x="825" y="301" fill="#b9c7ce" font-family="Segoe UI,Arial,sans-serif" font-size="13">Check case-insensitive filesystems.</text>
</svg>
