[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zipflight"
version = "0.1.1"
description = "Check a ZIP before you ship it: offline archive portability reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "zare"}]
keywords = ["zip", "portability", "windows", "archive", "cli", "lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
zipflight = "zipflight.cli:main"

[project.urls]
Homepage = "https://github.com/zare5/zipflight"
Issues = "https://github.com/zare5/zipflight/issues"
Changelog = "https://github.com/zare5/zipflight/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["zipflight*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
