name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the oldest supported Python on an established runner image.
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_zipapp.py
      - run: python dist/zipflight.pyz --version

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/build_zipapp.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pyinstaller
      - run: python tools/build_windows.py
      - run: ./dist/zipflight-windows-x64.exe --version
      - name: Smoke test executable with deliberately failing demo
        shell: pwsh
        run: |
          $result = & ./dist/zipflight-windows-x64.exe --demo --format json
          if ($LASTEXITCODE -ne 1) { throw 'Demo must exit 1 for findings.' }
          $report = $result | ConvertFrom-Json
          if ($report.summary.errors -lt 1) { throw 'Expected demo errors.' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/zipflight-windows-x64.exe
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
